name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Cloudflare Pages (static)
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: ecofarm-risk-dashboard
          directory: .          # 빌드 없이 레포 루트를 그대로 서빙
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          # branch 미지정 시 기본값(main) 자동 사용
